name: 기능 추가
description: 하나의 사용자 흐름을 정의하고 디자인·개발을 연결합니다.
title: "[기능] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 사용자 문제
      description: 누가 어떤 상황에서 겪는 문제인가요?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 기대 행동과 이번 범위
      description: 사용자가 할 수 있어야 하는 행동과 다음 단계로 남길 일을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 정상·빈 화면·오류·로딩, 데이터 유지, 접근성 등 실제 확인 가능한 조건을 적어 주세요.
      placeholder: "예: 저장한 링크가 앱 재실행 후에도 보인다."
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 디자인 연결
      description: SCR/CMP ID, Figma node URL·버전·디자인 상태. 미연결이면 예정된 리뷰 기준을 적어 주세요.
      placeholder: "SCR-002 AddLink / CMP-003 PrimaryButton"
  - type: dropdown
    id: status
    attributes:
      label: 협업 상태
      options:
        - "ready — 리뷰 준비"
        - "approved — 승인"
        - "inprogress — 구현 중"
        - "verified — 검증 완료"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 의존 기능과 확인할 사항
      description: 플랫폼 연동·권한·데이터 근거·미확정 정책을 적어 주세요. 지원이 확인되지 않은 기능은 가정으로 표시합니다.
